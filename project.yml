# xcodegen spec for the SlothIOS app. Run `xcodegen generate` to
# produce SlothIOS.xcodeproj. The .xcodeproj is gitignored — this YAML
# is the authoritative project definition.

name: SlothIOS

options:
  bundleIdPrefix: io.river.sloth
  deploymentTarget:
    iOS: "17.0"
    iPadOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES

packages:
  SlothCore:
    path: .

targets:
  SlothIOS:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Tests/**"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: sloth
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # An empty UILaunchScreen dict opts the app into modern launch
        # behaviour. Without it iOS treats the app as legacy and runs
        # it in iPhone-4 (320×480) compatibility mode — the "small
        # square in the middle of the screen" symptom.
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        ITSAppUsesNonExemptEncryption: false
        # Bonjour service types this app browses AND publishes (iOS
        # 14+ requirement). `_sloth._tcp` = a sloth data socket this
        # app reads; `_sloth-post._tcp` = a sensor post — published
        # when this device serves as a post, browsed when it is the
        # fleet viewer.
        NSBonjourServices:
          - _sloth._tcp
          - _sloth-post._tcp
        # Shown in the iOS "Local Network" prompt the first time
        # discovery runs, the first time NWConnection makes a peer-to-
        # peer connect, or the first time the post server advertises.
        NSLocalNetworkUsageDescription: "Find sloth instances on your tailnet, and serve this device as a sensor post."
        # Sensor-post permissions. Each degrades gracefully: a denied
        # permission just means the matching record carries nulls.
        NSBluetoothAlwaysUsageDescription: "Scan for nearby Bluetooth devices to report as radar contacts."
        NSMotionUsageDescription: "Read the compass and magnetometer to orient radar contacts."
        NSLocationWhenInUseUsageDescription: "Tag this sensor post with heading and, if you allow it, a coarse position."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.river.sloth.ios
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        # Device signing for physical installs (river.io llc team).
        # Automatic signing lets -allowProvisioningUpdates mint the
        # App ID + profile and register a new device on first build.
        DEVELOPMENT_TEAM: U3Z59VXPUB
        # Manual signing with the portal-made "sloth ios dev" profile
        # on the io.river.sloth.ios App ID, which carries the Access
        # WiFi Information capability (wifi_self SSID/BSSID). Manual
        # because this Mac's command-line Xcode has no account to
        # auto-provision with.
        CODE_SIGN_STYLE: Manual
        PROVISIONING_PROFILE_SPECIFIER: "sloth ios dev"
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: App/SlothIOS.entitlements
    dependencies:
      - package: SlothCore
        product: SlothCore

  SlothIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - App/Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.river.sloth.ios.tests
    dependencies:
      - target: SlothIOS
      - package: SlothCore
        product: SlothCore

schemes:
  SlothIOS:
    build:
      targets:
        SlothIOS: all
        SlothIOSTests: [test]
    test:
      targets:
        - SlothIOSTests
    run:
      config: Debug
